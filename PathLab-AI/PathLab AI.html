<style>:root {
  color-scheme: dark;
  --background: #0b1118;
  --surface: #101923;
  --surface-raised: #15212d;
  --line: #293848;
  --text: #edf2f5;
  --muted: #a4b2c2;
  --mint: #85e3cd;
  --peach: #ffb783;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 28px; }
body { margin: 0; background: var(--background); color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; -webkit-font-smoothing: antialiased; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
button:not(:disabled), a { touch-action: manipulation; }
button:not(:disabled) { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button, h1, h2, h3, p, figure, ul, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 5px; }
::selection { background: #225849; color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip-link { position: absolute; z-index: 5; left: 20px; top: 12px; padding: 12px 20px; background: var(--mint); color: #10231e; border-radius: 8px; transform: translateY(-180%); }
.skip-link:focus { transform: translateY(0); }
.site-header { max-width: 1560px; margin: 0 auto; min-height: 94px; padding: 20px 48px; display: flex; align-items: center; gap: 36px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 12px; color: var(--mint); background: #162a2c; }
.brand-mark svg { width: 37px; height: 37px; }
.brand-wordmark { font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -.8px; }
.brand-ai { margin-left: 5px; color: var(--mint); font-size: 12px; letter-spacing: .5px; vertical-align: top; }
.brand-wordmark small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 400; letter-spacing: 2px; }
.header-nav { margin-left: auto; display: flex; gap: 28px; font-size: 13px; color: var(--muted); }
.header-nav a { padding: 10px 0; }
.header-nav a:hover { color: var(--mint); }
.mode-badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #30453f; padding: 9px 12px; border-radius: 99px; font-size: 11px; white-space: nowrap; color: #b2d8cb; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }
.mode-detail { color: var(--muted); margin-left: -5px; }
.page-shell { max-width: 1560px; margin: 0 auto; padding: 0 48px; }
.intro { display: grid; grid-template-columns: 1.15fr 1fr; gap: 70px; align-items: center; padding: 56px 0 52px; }
.eyebrow { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 1.6px; line-height: 1.6; }
.intro .eyebrow { color: var(--mint); display: flex; align-items: center; gap: 9px; }
.intro .eyebrow > span { font-size: 18px; }
h1 { margin-top: 16px; font-size: clamp(34px, 3.3vw, 48px); font-weight: 650; line-height: 1.4; letter-spacing: -1.4px; }
h1 > span { color: var(--mint); }
.intro-description { margin-top: 17px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.primary-link { display: inline-flex; justify-content: space-between; align-items: center; gap: 34px; margin-top: 24px; padding: 12px 18px; background: var(--mint); border: 1px solid var(--mint); border-radius: 8px; color: #11251e; font-size: 13px; font-weight: 600; transition: background .15s; }
.primary-link:hover { background: #b3f2e3; }
.primary-link > span { font-size: 20px; line-height: 1; }
.learning-loop { border: 1px solid var(--line); border-radius: 18px; padding: 21px 24px 17px; background: linear-gradient(120deg, #14212b, #101923); }
.loop-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; color: var(--muted); font-size: 9px; letter-spacing: 1px; }
.loop-caption > span:last-child { letter-spacing: 0; font-size: 10px; }
.learning-loop ol { padding: 0; list-style: none; }
.learning-loop li { display: flex; align-items: center; gap: 15px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.learning-loop li:last-child { border-bottom: 0; }
.loop-number { font-family: Consolas, monospace; color: var(--mint); font-size: 13px; }
.learning-loop strong { font-size: 14px; font-weight: 600; }
.learning-loop li p { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.loop-symbol { color: #a9c6bc; margin-left: auto; font-family: Consolas, monospace; font-size: 24px; }
.loop-note { color: var(--muted); font-size: 10px; line-height: 1.8; margin-top: 2px; }
.workspace { display: grid; grid-template-columns: 246px minmax(0, 1fr); align-items: start; gap: 28px; padding-top: 10px; }
.section-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.section-label h2 { font-size: 14px; font-weight: 600; }
.section-label > span { color: var(--muted); font-size: 10px; }
.mission-list { display: grid; gap: 10px; }
.mission-card { width: 100%; min-height: 135px; display: flex; flex-direction: column; align-items: stretch; text-align: left; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; transition: border-color .15s, background .15s; }
.mission-card:hover { border-color: #6c8d85; background: #16242d; }
.mission-card[aria-pressed='true'] { border-color: var(--mint); background: #142b2b; }
.mission-card-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; letter-spacing: .6px; }
.mission-card[aria-pressed='true'] .mission-card-meta { color: var(--mint); }
.mission-card strong { margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.5; }
.mission-card-description { margin: 7px 0 14px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.mission-card-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 9px; }
.mission-card-bottom > span:first-child { border: 1px solid #43524e; padding: 2px 5px; border-radius: 4px; color: #b6cdc6; font-family: Consolas, monospace; }
.sidebar-note { margin-top: 17px; color: var(--muted); font-size: 10px; line-height: 1.9; padding-left: 3px; }
.mission-content { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.mission-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.mission-heading .eyebrow { color: var(--mint); font-size: 10px; letter-spacing: 1.1px; }
.mission-heading h2 { margin-top: 8px; font-size: 24px; font-weight: 600; line-height: 1.45; letter-spacing: -.5px; }
.neutral-badge { display: inline-block; border: 1px solid #3b4b5a; background: #17232e; color: #bac6d1; padding: 5px 8px; border-radius: 5px; font-size: 10px; line-height: 1.5; white-space: nowrap; }
.mission-narrative { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.9; }
.mission-panels { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(210px, 1fr); gap: 22px; margin-top: 25px; }
.map-panel { min-width: 0; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
.panel-heading h3 { font-size: 12px; font-weight: 500; }
.panel-heading > span { color: var(--muted); font-size: 9px; }
.map-surface { position: relative; display: grid; place-items: center; min-height: 330px; padding: 50px 25px; border: 1px solid #293a48; border-radius: 12px; background-color: #0d1620; background-image: radial-gradient(#2a3a44 1px, transparent 1px); background-size: 18px 18px; }
.map-axis, .map-origin { position: absolute; left: 15px; font-family: Consolas, 'Microsoft YaHei', monospace; font-size: 9px; letter-spacing: .6px; color: var(--muted); }
.map-axis { top: 14px; }
.map-origin { bottom: 14px; }
.map-grid { width: min(100%, 400px); display: grid; grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr)); gap: 5px; }
.map-cell { display: grid; place-items: center; aspect-ratio: 1; min-width: 0; border-radius: 5px; border: 1px solid #3d4e5f; font: 600 14px/1 Consolas, monospace; }
.map-cell--road { background: #182633; }
.road-dot { width: 3px; height: 3px; border-radius: 50%; background: #768b99; }
.map-cell--wall { background: repeating-linear-gradient(135deg, #31404f 0, #31404f 4px, #283541 4px, #283541 8px); border-color: #71808d; }
.wall-mark { width: 30%; border-top: 2px solid #aab5bf; }
.map-cell--start { background: var(--mint); border-color: var(--mint); color: #102b26; }
.map-cell--goal { background: var(--peach); border-color: var(--peach); color: #392312; }
.map-figure figcaption { display: flex; gap: 15px; flex-wrap: wrap; padding: 14px 2px; color: var(--muted); font-size: 9px; }
.map-figure figcaption > span { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.legend-swatch--start { background: var(--mint); }
.legend-swatch--goal { background: var(--peach); }
.legend-swatch--wall { background: repeating-linear-gradient(135deg, #aab5bf 0, #aab5bf 2px, #31404f 2px, #31404f 4px); }
.legend-swatch--road { background: #182633; border: 1px solid #8d9caa; }
.map-coordinates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 10px; }
.map-coordinates strong { margin-left: 4px; color: var(--text); font-family: Consolas, monospace; font-weight: 400; }
.map-coordinates > span:last-child { font-size: 9px; }
.map-note { margin-top: 10px; color: var(--muted); font-size: 10px; line-height: 1.8; }
.briefing-panel { min-width: 0; border-left: 1px solid var(--line); padding-left: 22px; }
.briefing-panel h3 { margin-top: 7px; font-size: 14px; font-weight: 600; line-height: 1.65; }
.objectives { padding: 0; list-style: none; margin-top: 18px; }
.objectives li { display: flex; align-items: start; gap: 8px; margin-bottom: 12px; }
.objectives li > span { color: var(--mint); font: 10px/1.9 Consolas, monospace; }
.objectives p { font-size: 11px; line-height: 1.9; color: #c5cfd8; }
.algorithm-summary { border-top: 1px solid var(--line); margin-top: 19px; padding-top: 15px; }
.algorithm-summary > span { color: var(--muted); font-size: 10px; }
.algorithm-summary strong { margin-left: 12px; font-family: Consolas, monospace; font-size: 12px; font-weight: 400; color: var(--mint); }
.algorithm-summary p { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.9; }
.launch-state { padding: 17px 14px; margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; background: #121f29; }
.launch-state > p { margin: 11px 0 14px; font-size: 11px; line-height: 1.8; color: #c5cfd8; }
.launch-state button { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid #47565e; border-radius: 6px; background: #24343b; padding: 10px 12px; color: #b3c1c6; font-size: 11px; }
.launch-state small { display: block; margin-top: 9px; color: var(--muted); font-size: 9px; line-height: 1.8; }
.development-status { display: grid; grid-template-columns: 1fr 1fr; gap: 42px; padding: 30px 0; border-top: 1px solid var(--line); margin-top: 42px; }
.development-status h2 { margin-top: 9px; font-size: 18px; font-weight: 500; line-height: 1.6; }
.development-status p:not(.eyebrow) { color: var(--muted); font-size: 11px; line-height: 1.8; margin-top: 9px; }
.development-status ul { list-style: none; padding: 0; display: grid; gap: 12px; align-content: center; }
.development-status li { display: flex; gap: 13px; align-items: center; color: #b6c1cc; font-size: 11px; line-height: 1.8; }
.status-label { color: var(--muted); background: #18232f; border: 1px solid #3b4b5a; font-size: 9px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.status-label--ready { color: var(--mint); background: #142b28; border-color: #375f55; }
.site-footer { max-width: 1560px; margin: 0 auto; padding: 22px 48px max(22px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 10px; line-height: 1.8; }
.site-footer > span:first-child > span { margin: 0 10px; color: #7a8b9d; }

@media (min-width: 1441px) {
  .map-surface { min-height: 375px; }
}

  .briefing-panel { display: block; border-top: 0; padding-top: 0; padding-left: 20px; border-left: 1px solid var(--line); }
  .algorithm-summary { border-top: 1px solid var(--line); padding-top: 15px; }

  .brand-wordmark small { font-size: 9px; }

  .learning-loop { padding: 18px 19px 15px; border-radius: 14px; }
  .learning-loop li { padding: 14px 0; gap: 12px; }
  .loop-caption { font-size: 8px; }
  .loop-caption > span:last-child { font-size: 9px; }
  .workspace { padding-top: 0; gap: 20px; }
  .section-label { margin-bottom: 13px; }
  .mission-card { padding: 13px; min-height: 158px; }
  .mission-card strong { font-size: 13px; margin-top: 8px; }

  .mission-card-meta { font-size: 9px; }
  .mission-card-bottom { font-size: 9px; gap: 5px; }
  .sidebar-note { font-size: 9px; }
  .mission-content { padding: 18px 16px; border-radius: 14px; }
  .mission-heading { align-items: flex-start; flex-direction: column; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

/* Learning controls share the shell tokens; only new components are styled here. */
.learning-map { position: relative; }
.search-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.learning-map .map-cell { padding: 0; position: relative; color: #d5e2ed; }
.learning-map .map-cell--start { color: #102b26; }
.learning-map .map-cell--goal { color: #392312; }
.learning-map .map-cell[data-search="已扩展"]:not(.map-cell--start):not(.map-cell--goal) { background: #253c49; }
.learning-map .map-cell[data-on-path="true"] { box-shadow: inset 0 0 0 1px #94b9ed; }
.learning-map .map-cell[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 1px; z-index: 3; }
.run-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 18px 0; }
.run-metrics > div { padding: 12px 7px; border: 1px solid var(--line); background: #0d1721; border-radius: 8px; }
.run-metrics dt { color: var(--muted); font-size: 10px; line-height: 1.6; }
.run-metrics dd { margin: 8px 0 0; color: var(--mint); font: 600 clamp(14px, 2vw, 22px)/1.4 Consolas, 'Microsoft YaHei', monospace; overflow-wrap: anywhere; }
.playback-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.action-primary, .action-secondary, .action-quiet { min-height: 44px; border-radius: 7px; padding: 10px 13px; font-size: 12px; line-height: 1.6; border: 1px solid #486557; }
.action-primary { color: #10251f; background: var(--mint); font-weight: 600; }
.action-secondary { background: #20362f; color: #b0f2df; }
.action-quiet { background: #182633; color: var(--text); border-color: #495c6d; }
.action-primary:disabled, .action-secondary:disabled, .action-quiet:disabled { color: #acb8c2; background: #24303b; border-color: #495661; }
.action-primary:not(:disabled):hover, .action-secondary:not(:disabled):hover, .action-quiet:not(:disabled):hover { filter: brightness(1.1); }
.speed-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.speed-label select, .algorithm-summary select { min-height: 44px; background: #0d1721; color: var(--text); border: 1px solid #576b7d; border-radius: 6px; padding: 8px; font: inherit; }
.speed-label select:disabled, .algorithm-summary select:disabled { color: #b3c0cc; opacity: 1; }
.control-help { font-size: 10px; color: var(--muted); line-height: 1.9; margin: 10px 0 18px; }
.algorithm-summary label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
.algorithm-summary select { width: 100%; font-size: 13px; }
.briefing-panel > .prediction-panel, .briefing-panel > .prediction-feedback, .briefing-panel > .run-summary, .briefing-panel > .learning-stats { grid-column: 1 / -1; }
.prediction-panel { margin-top: 20px; background: #132b28; border: 1px solid #477366; border-radius: 10px; padding: 16px; min-width: 0; }
.prediction-panel h4, .prediction-feedback h4, .run-summary h4 { font-size: 14px; line-height: 1.8; margin: 8px 0; }
.prediction-panel > p:not(.eyebrow), .prediction-feedback p, .run-summary p:not(.eyebrow) { font-size: 11px; line-height: 1.9; color: #cad7d7; }
.prediction-panel > small, .prediction-feedback small { display: block; margin-top: 10px; color: #bdcfc9; font-size: 10px; line-height: 1.8; }
.candidate-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.candidate-list button { display: grid; gap: 7px; text-align: left; min-height: 90px; padding: 11px; border: 1px solid #617e74; border-radius: 8px; color: #ecf5f0; background: #1a3830; }
.candidate-list button[aria-pressed="true"] { border: 2px solid var(--mint); padding: 10px; background: #294c40; }
.candidate-list strong { font: 600 16px/1.3 Consolas, monospace; }
.candidate-list span { font: 11px/1.8 Consolas, monospace; }
.candidate-list small { font-size: 10px; color: #c0d2c8; }
.prediction-panel > .action-primary { display: block; width: 100%; margin-bottom: 9px; }
.prediction-panel > .hint-copy { border-left: 2px solid var(--mint); padding-left: 10px; margin-top: 12px; }
.prediction-feedback, .run-summary { min-width: 0; margin-top: 18px; padding: 15px; border: 1px solid #735f4e; background: #29241f; border-radius: 9px; }
.prediction-feedback.is-correct { background: #152a27; border-color: #466f62; }
.run-summary { background: #1b2533; border-color: #4f6582; }
.learning-stats { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; color: var(--muted); font-size: 10px; line-height: 1.9; }
.interaction-error { color: #ffd0b0; font-size: 12px; line-height: 1.8; margin-top: 12px; }
.node-inspector { border: 1px solid var(--line); padding: 14px; border-radius: 9px; margin-top: 18px; }
.node-inspector h4 { font-size: 12px; margin: 0 0 10px; line-height: 1.8; }
.node-inspector h4 span { display: block; color: var(--muted); font: 10px/1.8 Consolas, 'Microsoft YaHei', monospace; }
.node-inspector p { color: var(--muted); font-size: 11px; line-height: 1.8; }
.node-values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
.node-values dt { font-size: 10px; color: var(--muted); }
.node-values dd { margin: 6px 0 0; font: 12px/1.6 Consolas, 'Microsoft YaHei', monospace; overflow-wrap: anywhere; }
.node-values > div:last-child { grid-column: span 2; }
.evidence-details { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.evidence-details summary { min-height: 44px; padding: 12px; font-size: 11px; line-height: 1.8; cursor: pointer; }
.evidence-details summary > span { display: block; color: var(--muted); font-size: 10px; padding-left: 12px; }
.evidence-details > p { padding: 0 12px 12px; font-size: 11px; line-height: 1.9; color: var(--muted); }
.path-coordinates { overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; max-width: 100%; padding: 0 10px 10px; }
.table-scroll table { border-collapse: collapse; width: 100%; font: 11px/1.8 Consolas, 'Microsoft YaHei', monospace; white-space: nowrap; }
.table-scroll th, .table-scroll td { padding: 8px 7px; text-align: left; border-bottom: 1px solid var(--line); }
.table-scroll th { color: #c9d6e2; font-weight: 500; }
.event-timeline { padding: 0 12px 12px; list-style: none; max-height: 360px; overflow-y: auto; }
.event-timeline li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 10px; }
.event-step { min-width: 24px; color: var(--mint); font-family: Consolas, monospace; }
.event-timeline li > div { min-width: 0; display: grid; gap: 6px; }
.event-timeline strong { font-weight: 500; }
.event-timeline small, .event-timeline li > div > span { color: var(--muted); line-height: 1.7; overflow-wrap: anywhere; }
.reflection-panel { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 24px; min-width: 0; }
.reflection-panel h3 { font-size: 20px; line-height: 1.6; margin: 8px 0 16px; }
.reflection-panel h4 { font-size: 15px; line-height: 1.8; margin: 8px 0 12px; }
.reflection-panel p, .report-snapshot small { font-size: 12px; line-height: 1.9; color: #c7d6df; }
.reflection-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
.reflection-heading h3 { margin-bottom: 0; }
.reflection-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.local-feedback, .comparison-card, .report-snapshot { background: #14232e; border: 1px solid #3e5868; border-radius: 10px; padding: 18px; min-width: 0; }
.local-feedback .panel-heading { flex-wrap: wrap; gap: 8px; }
.diagnosis-boundary { border-left: 2px solid var(--peach); padding-left: 10px; margin: 12px 0; }
.reflection-panel .table-scroll { padding: 0 0 10px; }
.reflection-panel .table-scroll table { white-space: normal; font-size: 12px; }
.feedback-evidence { padding: 0 12px 12px 28px; }
.feedback-evidence li { margin-bottom: 12px; }
.feedback-evidence small, .comparison-sources dd, .report-citations { color: #b5c9d6; font: 10px/1.8 Consolas, 'Microsoft YaHei', monospace; overflow-wrap: anywhere; }
.comparison-sources { padding: 0 12px 12px; }
.comparison-sources div { margin-bottom: 10px; }
.comparison-sources dt { font-size: 11px; color: var(--muted); }
.comparison-sources dd { margin: 5px 0 0; }
.reflection-form { margin-top: 22px; }
.reflection-form fieldset { border: 0; margin: 0 0 20px; padding: 0; min-width: 0; }
.reflection-form legend, .explanation-label { font-size: 14px; line-height: 1.8; font-weight: 600; margin-bottom: 10px; display: block; }
.reflection-facts { display: grid; gap: 9px; margin-top: 12px; }
.reflection-facts label { display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: #10202b; border: 1px solid #415767; border-radius: 8px; cursor: pointer; font-size: 12px; line-height: 1.9; }
.reflection-facts input { flex: 0 0 20px; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--mint); }
.reflection-facts span { min-width: 0; overflow-wrap: anywhere; }
.reflection-facts small { display: block; color: #b5c9d6; font: 10px/1.8 Consolas, monospace; margin-top: 6px; }
.reflection-form textarea { width: 100%; display: block; resize: vertical; min-height: 135px; border: 1px solid #5d7a8d; border-radius: 8px; padding: 12px; background: #0b1823; color: var(--text); font: 13px/1.9 'Microsoft YaHei', sans-serif; }
.reflection-form textarea::placeholder { color: #a6bac9; }
.reflection-form #reflection-help { margin-top: 9px; color: #b5c9d6; font-size: 11px; }
.reflection-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.report-snapshot { margin-top: 20px; }
.report-snapshot h5 { font-size: 13px; margin-top: 18px; }
.report-snapshot blockquote { margin: 12px 0; border-left: 2px solid var(--mint); padding: 12px; background: #0c1a23; color: #dbeae7; font-size: 13px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
.report-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 16px 0; font-size: 12px; line-height: 1.8; }
.report-checks li { display: flex; align-items: flex-start; gap: 9px; }
.report-checks span { color: var(--mint); }
.saved-report { margin-top: 18px; }
.saved-report summary { cursor: pointer; min-height: 44px; padding: 12px 0; font-size: 12px; }
.report-history { border-top: 1px solid var(--line); padding-top: 12px; }
.report-history > p { font-size: 12px; color: #c7d6df; line-height: 1.9; }
.report-history > div { margin-top: 20px; }
@media (max-width: 600px) {
  .prediction-panel { padding: 14px; }
  .reflection-columns, .report-checks { grid-template-columns: minmax(0, 1fr); }
  .local-feedback, .comparison-card, .report-snapshot { padding: 14px; }
  .reflection-panel h3 { font-size: 18px; }
  .node-values { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .node-values > div:last-child { grid-column: 1 / -1; }
}

/* Versioned local progress: one scoped block, sharing existing control tokens. */
.progress-panel { margin: 0 0 24px; padding: clamp(16px, 3vw, 28px); border: 1px solid var(--line); border-radius: 12px; background: #101e29; min-width: 0; }
.progress-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
.progress-heading h2 { font-size: clamp(17px, 2vw, 23px); margin: 8px 0; }
.progress-panel p { color: var(--muted); font-size: 12px; line-height: 1.9; overflow-wrap: anywhere; }
.progress-panel summary { cursor: pointer; color: var(--mint); font-size: 12px; padding: 10px 0; min-height: 44px; }
.progress-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.progress-file { display: grid; gap: 7px; font-size: 12px; color: var(--text); max-width: 100%; min-width: 0; }
.progress-file input { max-width: 100%; min-height: 44px; font: inherit; color: var(--muted); }
.progress-file input::file-selector-button { min-height: 44px; padding: 8px; margin-right: 8px; color: var(--text); background: #20362f; border: 1px solid #49685b; border-radius: 6px; }
.progress-preview, .progress-recovery { margin-top: 16px; padding: 14px; border: 1px solid #526a77; border-radius: 8px; }
.progress-preview h3 { font-size: 15px; line-height: 1.6; }
.progress-panel .progress-error { color: #ffc2ab; }

.standalone-notice { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--line); color: var(--muted); background: var(--surface); text-align: center; font-size: 12px; line-height: 1.7; }
.standalone-loading { padding: 36px 20px; }
</style>
