<style>:root {
  color-scheme: dark;
  --background: #0b1118;
  --surface: #101923;
  --surface-raised: #15212d;
  --line: #293848;
  --text: #edf2f5;
  --muted: #a4b2c2;
  --mint: #85e3cd;
  --peach: #ffb783;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 28px; }
body { margin: 0; background: var(--background); color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; -webkit-font-smoothing: antialiased; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
button:not(:disabled), a { touch-action: manipulation; }
button:not(:disabled) { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button, h1, h2, h3, p, figure, ul, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 5px; }
::selection { background: #225849; color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip-link { position: absolute; z-index: 5; left: 20px; top: 12px; padding: 12px 20px; background: var(--mint); color: #10231e; border-radius: 8px; transform: translateY(-180%); }
.skip-link:focus { transform: translateY(0); }
.site-header { max-width: 1560px; margin: 0 auto; min-height: 94px; padding: 20px 48px; display: flex; align-items: center; gap: 36px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 12px; color: var(--mint); background: #162a2c; }
.brand-mark svg { width: 37px; height: 37px; }
.brand-wordmark { font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -.8px; }
.brand-ai { margin-left: 5px; color: var(--mint); font-size: 12px; letter-spacing: .5px; vertical-align: top; }
.brand-wordmark small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 400; letter-spacing: 2px; }
.header-nav { margin-left: auto; display: flex; gap: 28px; font-size: 13px; color: var(--muted); }
.header-nav a { padding: 10px 0; }
.header-nav a:hover { color: var(--mint); }
.mode-badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #30453f; padding: 9px 12px; border-radius: 99px; font-size: 11px; white-space: nowrap; color: #b2d8cb; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }
.mode-detail { color: var(--muted); margin-left: -5px; }
.page-shell { max-width: 1560px; margin: 0 auto; padding: 0 48px; }
.intro { display: grid; grid-template-columns: 1.15fr 1fr; gap: 70px; align-items: center; padding: 56px 0 52px; }
.eyebrow { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 1.6px; line-height: 1.6; }
.intro .eyebrow { color: var(--mint); display: flex; align-items: center; gap: 9px; }
.intro .eyebrow > span { font-size: 18px; }
h1 { margin-top: 16px; font-size: clamp(34px, 3.3vw, 48px); font-weight: 650; line-height: 1.4; letter-spacing: -1.4px; }
h1 > span { color: var(--mint); }
.intro-description { margin-top: 17px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.primary-link { display: inline-flex; justify-content: space-between; align-items: center; gap: 34px; margin-top: 24px; padding: 12px 18px; background: var(--mint); border: 1px solid var(--mint); border-radius: 8px; color: #11251e; font-size: 13px; font-weight: 600; transition: background .15s; }
.primary-link:hover { background: #b3f2e3; }
.primary-link > span { font-size: 20px; line-height: 1; }
.learning-loop { border: 1px solid var(--line); border-radius: 18px; padding: 21px 24px 17px; background: linear-gradient(120deg, #14212b, #101923); }
.loop-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; color: var(--muted); font-size: 9px; letter-spacing: 1px; }
.loop-caption > span:last-child { letter-spacing: 0; font-size: 10px; }
.learning-loop ol { padding: 0; list-style: none; }
.learning-loop li { display: flex; align-items: center; gap: 15px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.learning-loop li:last-child { border-bottom: 0; }
.loop-number { font-family: Consolas, monospace; color: var(--mint); font-size: 13px; }
.learning-loop strong { font-size: 14px; font-weight: 600; }
.learning-loop li p { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.loop-symbol { color: #a9c6bc; margin-left: auto; font-family: Consolas, monospace; font-size: 24px; }
.loop-note { color: var(--muted); font-size: 10px; line-height: 1.8; margin-top: 2px; }
.workspace { display: grid; grid-template-columns: 246px minmax(0, 1fr); align-items: start; gap: 28px; padding-top: 10px; }
.section-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.section-label h2 { font-size: 14px; font-weight: 600; }
.section-label > span { color: var(--muted); font-size: 10px; }
.mission-list { display: grid; gap: 10px; }
.mission-card { width: 100%; min-height: 135px; display: flex; flex-direction: column; align-items: stretch; text-align: left; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; transition: border-color .15s, background .15s; }
.mission-card:hover { border-color: #6c8d85; background: #16242d; }
.mission-card[aria-pressed='true'] { border-color: var(--mint); background: #142b2b; }
.mission-card-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; letter-spacing: .6px; }
.mission-card[aria-pressed='true'] .mission-card-meta { color: var(--mint); }
.mission-card strong { margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.5; }
.mission-card-description { margin: 7px 0 14px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.mission-card-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 9px; }
.mission-card-bottom > span:first-child { border: 1px solid #43524e; padding: 2px 5px; border-radius: 4px; color: #b6cdc6; font-family: Consolas, monospace; }
.sidebar-note { margin-top: 17px; color: var(--muted); font-size: 10px; line-height: 1.9; padding-left: 3px; }
.mission-content { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.mission-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.mission-heading .eyebrow { color: var(--mint); font-size: 10px; letter-spacing: 1.1px; }
.mission-heading h2 { margin-top: 8px; font-size: 24px; font-weight: 600; line-height: 1.45; letter-spacing: -.5px; }
.neutral-badge { display: inline-block; border: 1px solid #3b4b5a; background: #17232e; color: #bac6d1; padding: 5px 8px; border-radius: 5px; font-size: 10px; line-height: 1.5; white-space: nowrap; }
.mission-narrative { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.9; }
.mission-panels { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(210px, 1fr); gap: 22px; margin-top: 25px; }
.map-panel { min-width: 0; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
.panel-heading h3 { font-size: 12px; font-weight: 500; }
.panel-heading > span { color: var(--muted); font-size: 9px; }
.map-surface { position: relative; display: grid; place-items: center; min-height: 330px; padding: 50px 25px; border: 1px solid #293a48; border-radius: 12px; background-color: #0d1620; background-image: radial-gradient(#2a3a44 1px, transparent 1px); background-size: 18px 18px; }
.map-axis, .map-origin { position: absolute; left: 15px; font-family: Consolas, 'Microsoft YaHei', monospace; font-size: 9px; letter-spacing: .6px; color: var(--muted); }
.map-axis { top: 14px; }
.map-origin { bottom: 14px; }
.map-grid { width: min(100%, 400px); display: grid; grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr)); gap: 5px; }
.map-cell { display: grid; place-items: center; aspect-ratio: 1; min-width: 0; border-radius: 5px; border: 1px solid #3d4e5f; font: 600 14px/1 Consolas, monospace; }
.map-cell--road { background: #182633; }
.road-dot { width: 3px; height: 3px; border-radius: 50%; background: #768b99; }
.map-cell--wall { background: repeating-linear-gradient(135deg, #31404f 0, #31404f 4px, #283541 4px, #283541 8px); border-color: #71808d; }
.wall-mark { width: 30%; border-top: 2px solid #aab5bf; }
.map-cell--start { background: var(--mint); border-color: var(--mint); color: #102b26; }
.map-cell--goal { background: var(--peach); border-color: var(--peach); color: #392312; }
.map-figure figcaption { display: flex; gap: 15px; flex-wrap: wrap; padding: 14px 2px; color: var(--muted); font-size: 9px; }
.map-figure figcaption > span { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.legend-swatch--start { background: var(--mint); }
.legend-swatch--goal { background: var(--peach); }
.legend-swatch--wall { background: repeating-linear-gradient(135deg, #aab5bf 0, #aab5bf 2px, #31404f 2px, #31404f 4px); }
.legend-swatch--road { background: #182633; border: 1px solid #8d9caa; }
.map-coordinates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 10px; }
.map-coordinates strong { margin-left: 4px; color: var(--text); font-family: Consolas, monospace; font-weight: 400; }
.map-coordinates > span:last-child { font-size: 9px; }
.map-note { margin-top: 10px; color: var(--muted); font-size: 10px; line-height: 1.8; }
.briefing-panel { min-width: 0; border-left: 1px solid var(--line); padding-left: 22px; }
.briefing-panel h3 { margin-top: 7px; font-size: 14px; font-weight: 600; line-height: 1.65; }
.objectives { padding: 0; list-style: none; margin-top: 18px; }
.objectives li { display: flex; align-items: start; gap: 8px; margin-bottom: 12px; }
.objectives li > span { color: var(--mint); font: 10px/1.9 Consolas, monospace; }
.objectives p { font-size: 11px; line-height: 1.9; color: #c5cfd8; }
.algorithm-summary { border-top: 1px solid var(--line); margin-top: 19px; padding-top: 15px; }
.algorithm-summary > span { color: var(--muted); font-size: 10px; }
.algorithm-summary strong { margin-left: 12px; font-family: Consolas, monospace; font-size: 12px; font-weight: 400; color: var(--mint); }
.algorithm-summary p { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.9; }
.launch-state { padding: 17px 14px; margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; background: #121f29; }
.launch-state > p { margin: 11px 0 14px; font-size: 11px; line-height: 1.8; color: #c5cfd8; }
.launch-state button { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid #47565e; border-radius: 6px; background: #24343b; padding: 10px 12px; color: #b3c1c6; font-size: 11px; }
.launch-state small { display: block; margin-top: 9px; color: var(--muted); font-size: 9px; line-height: 1.8; }
.development-status { display: grid; grid-template-columns: 1fr 1fr; gap: 42px; padding: 30px 0; border-top: 1px solid var(--line); margin-top: 42px; }
.development-status h2 { margin-top: 9px; font-size: 18px; font-weight: 500; line-height: 1.6; }
.development-status p:not(.eyebrow) { color: var(--muted); font-size: 11px; line-height: 1.8; margin-top: 9px; }
.development-status ul { list-style: none; padding: 0; display: grid; gap: 12px; align-content: center; }
.development-status li { display: flex; gap: 13px; align-items: center; color: #b6c1cc; font-size: 11px; line-height: 1.8; }
.status-label { color: var(--muted); background: #18232f; border: 1px solid #3b4b5a; font-size: 9px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.status-label--ready { color: var(--mint); background: #142b28; border-color: #375f55; }
.site-footer { max-width: 1560px; margin: 0 auto; padding: 22px 48px max(22px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 10px; line-height: 1.8; }
.site-footer > span:first-child > span { margin: 0 10px; color: #7a8b9d; }


/* Interaction motion: finite cues only; grid geometry never moves relative to Canvas. */
@keyframes pathlab-rise-in { from { opacity: .45; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pathlab-node-reveal { from { box-shadow: inset 0 0 0 2px var(--mint); } to { box-shadow: inset 0 0 0 1px transparent; } }
@keyframes pathlab-scan { from { transform: translateX(-110%); } to { transform: translateX(230%); } }
.intro { position: relative; isolation: isolate; }
.intro::before { content: ''; position: absolute; z-index: -1; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 40%, rgba(133,227,205,.1), transparent 60%); }
.intro-copy, .learning-loop { animation: pathlab-rise-in .55s ease-out both; }
.learning-loop { animation-delay: .08s; position: relative; overflow: hidden; }
.learning-loop::after { content: ''; position: absolute; bottom: 0; left: 0; height: 1px; width: 45%; background: linear-gradient(90deg, transparent, var(--mint), transparent); opacity: .4; animation: pathlab-scan 1.8s ease-out both; pointer-events: none; }
.primary-link, .action-primary, .action-secondary, .action-quiet, .mission-card, .candidate-list button { transition: transform .18s ease, border-color .18s ease, background-color .18s ease, box-shadow .18s ease; }
.mission-card[aria-pressed='true'] { box-shadow: inset 3px 0 0 var(--mint); }
.mission-content, .prediction-panel, .prediction-feedback, .run-summary, .reflection-panel, .report-snapshot { animation: pathlab-rise-in .32s ease-out both; }
.learning-map .map-cell[data-search='已发现'], .learning-map .map-cell[data-search='已扩展'], .learning-map .map-cell[data-search='有效前沿'] { animation: pathlab-node-reveal .35s ease-out; }
.learning-map .map-cell.map-cell--current { border-color: var(--peach); }
.learning-map .map-cell[data-prediction-candidate='true']::after { content: '◇'; position: absolute; top: 0; right: 1px; color: var(--mint); font-size: 10px; line-height: 1; pointer-events: none; }
.learning-map .map-cell[data-prediction-selected='true'] { outline: 2px solid var(--peach); outline-offset: 1px; z-index: 3; }
.candidate-list button[aria-pressed='true'] { box-shadow: 0 0 0 3px rgba(133,227,205,.15); }
@media (hover: hover) and (pointer: fine) {
  .primary-link:hover, .action-primary:not(:disabled):hover, .action-secondary:not(:disabled):hover, .action-quiet:not(:disabled):hover, .candidate-list button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.16); }
  .mission-card:not(:disabled):hover { transform: translateY(-3px); }
}
.primary-link:active, .action-primary:not(:disabled):active, .action-secondary:not(:disabled):active, .action-quiet:not(:disabled):active, .candidate-list button:not(:disabled):active { transform: scale(.98); }

@media (min-width: 1441px) {
  .map-surface { min-height: 375px; }
}

@media (max-width: 1180px) {
  .site-header { padding-inline: 30px; gap: 25px; }
  .page-shell { padding-inline: 30px; }
  .intro { gap: 35px; }
  .workspace { grid-template-columns: 210px minmax(0, 1fr); gap: 20px; }
  .mission-content { padding: 20px; }
  .mission-panels { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .briefing-panel { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 22px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .briefing-panel > .eyebrow, .briefing-panel > h3 { grid-column: 1 / -1; }
  .algorithm-summary { margin-top: 18px; border: 0; padding: 0; }
  .launch-state { grid-column: 1 / -1; margin-top: 12px; }
  .map-grid { max-width: 350px; }
  .site-footer { padding-inline: 30px; }
}

@media (max-width: 800px) {
  .site-header { min-height: 80px; padding: 16px 24px; flex-wrap: wrap; gap: 16px; }
  .header-nav { gap: 22px; }
  .mode-badge { display: none; }
  .page-shell { padding-inline: 24px; }
  .intro { gap: 30px; grid-template-columns: 1fr; padding: 35px 0; }
  h1 { font-size: 39px; }
  .learning-loop { max-width: none; }
  .workspace { grid-template-columns: 1fr; gap: 24px; }
  .mission-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mission-card { min-height: 140px; }
  .sidebar-note { margin-top: 12px; }
  .sidebar-note br { display: none; }
  .mission-panels { grid-template-columns: minmax(0, 1fr) minmax(200px, .9fr); gap: 20px; }
  .briefing-panel { display: block; border-top: 0; padding-top: 0; padding-left: 20px; border-left: 1px solid var(--line); }
  .algorithm-summary { border-top: 1px solid var(--line); padding-top: 15px; }
  .launch-state { margin-top: 20px; }
  .development-status { gap: 26px; }
  .site-footer { padding-inline: 24px; }
}

@media (max-width: 600px) {
  html { scroll-padding-top: 20px; }
  .site-header { padding: 16px 20px; justify-content: space-between; gap: 14px; }
  .brand-mark { width: 38px; height: 38px; }
  .brand-wordmark { font-size: 22px; }
  .brand-wordmark small { font-size: 9px; }
  .header-nav { margin: 0; gap: 14px; font-size: 11px; }
  .header-nav a { padding: 10px 0; }
  .page-shell { padding-inline: 20px; }
  .intro { padding: 32px 0; gap: 28px; }
  h1 { font-size: 34px; letter-spacing: -1px; margin-top: 12px; }
  .intro-description { font-size: 12px; }
  .desktop-break { display: none; }
  .primary-link { margin-top: 20px; min-height: 46px; }
  .learning-loop { padding: 18px 19px 15px; border-radius: 14px; }
  .learning-loop li { padding: 14px 0; gap: 12px; }
  .loop-caption { font-size: 8px; }
  .loop-caption > span:last-child { font-size: 9px; }
  .workspace { padding-top: 0; gap: 20px; }
  .section-label { margin-bottom: 13px; }
  .mission-card { padding: 13px; min-height: 158px; }

/* Independent editable practice space, shared by HTTP and offline builds. */

.playground-tools, .playground-presets, .playground-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 10px 0; }
.playground label { display: grid; gap: 8px; color: var(--text); font-size: 12px; min-width: 0; }
.playground select { max-width: 100%; min-height: 44px; padding: 8px; border: 1px solid #526575; border-radius: 6px; background: #0b1118; color: var(--text); font: inherit; }

.playground-help { color: var(--muted); font-size: 11px; line-height: 1.8; margin: 12px 0; }

.playground-cell { aspect-ratio: 1; min-width: 0; min-height: 24px; padding: 0; background: #14212d; border: 1px solid #506678; border-radius: 4px; color: var(--text); font-size: 14px; }
.playground-cell[data-kind='wall'] { background: #3a4958; color: #e1e8ed; }

.playground-cell[data-kind='goal'] { background: var(--peach); color: #28190d; }
.playground-cell[data-current='true'] { outline: 2px solid var(--text); outline-offset: -3px; }
.playground-cell:focus-visible { position: relative; outline: 3px solid #fff; outline-offset: 1px; z-index: 1; }
.playground-console { min-width: 0; }
.playground-console > .action-primary { margin-top: 14px; width: 100%; }

.playground-metrics > div { padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.playground h3 { font-size: 15px; color: var(--mint); }
.playground dl { margin: 12px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 12px; }
.playground dt { color: var(--muted); }
.playground dd { margin: 0; }
@media (max-width: 760px) {
  .playground-layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }

}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .primary-link, .action-primary, .action-secondary, .action-quiet, .mission-card, .candidate-list button { transform: none !important; }
}

/* Learning controls share the shell tokens; only new components are styled here. */
.learning-map { position: relative; }
.search-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.learning-map .map-cell { padding: 0; position: relative; color: #d5e2ed; }

.learning-map .map-cell[data-on-path="true"] { box-shadow: inset 0 0 0 1px #94b9ed; }
.learning-map .map-cell[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 1px; z-index: 3; }
.run-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 18px 0; }
.run-metrics > div { padding: 12px 7px; border: 1px solid var(--line); background: #0d1721; border-radius: 8px; }

.playback-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.action-primary, .action-secondary, .action-quiet { min-height: 44px; border-radius: 7px; padding: 10px 13px; font-size: 12px; line-height: 1.6; border: 1px solid #486557; }

.action-quiet { background: #182633; color: var(--text); border-color: #495c6d; }

.speed-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }

.control-help { font-size: 10px; color: var(--muted); line-height: 1.9; margin: 10px 0 18px; }

.briefing-panel > .prediction-panel, .briefing-panel > .prediction-feedback, .briefing-panel > .run-summary, .briefing-panel > .learning-stats { grid-column: 1 / -1; }
.prediction-panel { margin-top: 20px; background: #132b28; border: 1px solid #477366; border-radius: 10px; padding: 16px; min-width: 0; }

.candidate-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }

.candidate-list button[aria-pressed="true"] { border: 2px solid var(--mint); padding: 10px; background: #294c40; }

.node-inspector { border: 1px solid var(--line); padding: 14px; border-radius: 9px; margin-top: 18px; }

.node-inspector p { color: var(--muted); font-size: 11px; line-height: 1.8; }
.node-values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }

.evidence-details { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }

.reflection-panel { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 24px; min-width: 0; }

.local-feedback, .comparison-card, .report-snapshot { background: #14232e; border: 1px solid #3e5868; border-radius: 10px; padding: 18px; min-width: 0; }

.reflection-panel .table-scroll { padding: 0 0 10px; }
.reflection-panel .table-scroll table { white-space: normal; font-size: 12px; }
.feedback-evidence { padding: 0 12px 12px 28px; }
.feedback-evidence li { margin-bottom: 12px; }
.feedback-evidence small, .comparison-sources dd, .report-citations { color: #b5c9d6; font: 10px/1.8 Consolas, 'Microsoft YaHei', monospace; overflow-wrap: anywhere; }
.comparison-sources { padding: 0 12px 12px; }
.comparison-sources div { margin-bottom: 10px; }
.comparison-sources dt { font-size: 11px; color: var(--muted); }
.comparison-sources dd { margin: 5px 0 0; }
.reflection-form { margin-top: 22px; }
.reflection-form fieldset { border: 0; margin: 0 0 20px; padding: 0; min-width: 0; }
.reflection-form legend, .explanation-label { font-size: 14px; line-height: 1.8; font-weight: 600; margin-bottom: 10px; display: block; }

/* Versioned local progress: one scoped block, sharing existing control tokens. */
.progress-panel { margin: 0 0 24px; padding: clamp(16px, 3vw, 28px); border: 1px solid var(--line); border-radius: 12px; background: #101e29; min-width: 0; }
.progress-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
.progress-heading h2 { font-size: clamp(17px, 2vw, 23px); margin: 8px 0; }
.progress-panel p { color: var(--muted); font-size: 12px; line-height: 1.9; overflow-wrap: anywhere; }
.progress-panel summary { cursor: pointer; color: var(--mint); font-size: 12px; padding: 10px 0; min-height: 44px; }
.progress-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.progress-file { display: grid; gap: 7px; font-size: 12px; color: var(--text); max-width: 100%; min-width: 0; }

.progress-preview h3 { font-size: 15px; line-height: 1.6; }
.progress-panel .progress-error { color: #ffc2ab; }

/* Optional remote review shares the existing panel layout; no motion or score changes. */
.remote-feedback { margin-block: 1rem; }
.remote-facts { max-height: 18rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .78rem; }

.remote-consent { display: flex; align-items: flex-start; gap: .65rem; margin-block: 1rem; }
.remote-consent input { flex: none; margin-top: .3rem; }
.remote-feedback small { overflow-wrap: anywhere; }

.web-review { margin-top: 24px; padding: clamp(16px, 3vw, 26px); border: 1px solid #527d75; border-radius: 14px; background: linear-gradient(140deg, #172e31, #101e29 65%); min-width: 0; animation: web-review-enter 220ms ease-out both; }

.web-review-topics { border: 0; padding: 0; margin: 0 0 22px; min-width: 0; }

.web-review-topics small { display: block; color: #bbced8; font-size: 11px; line-height: 1.8; margin-top: 6px; }
.web-review-topics label:focus-within { outline: 2px solid var(--mint); outline-offset: 3px; }
.web-review-preview-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 10px; }

.web-review .web-review-privacy { font-size: 11px; color: #bbced8; margin: 10px 0; }
.web-review-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

.web-review .web-review-status { min-height: 46px; margin: 12px 0 0; color: #b5f1d9; }
.web-review-help { border-top: 1px solid #354e59; margin-top: 12px; }

.web-review-api { margin: 14px 0 22px; border-bottom: 1px solid var(--line); }
.web-review-api > .remote-feedback { margin-top: 0; }
@keyframes web-review-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 900px) { .web-review-topics > div { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) {
  .web-review-stats { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .web-review-stats > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .web-review-stats dd { margin: 0; font-size: 15px; }
  .web-review-actions > * { width: 100%; }
  .web-review-preview { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .web-review { animation: none; } .web-review-topics label { transition: none; } }

/* A* zero-knowledge primer: larger type and high-contrast cell states for first-time learners. */
.intro-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 24px; }
.intro-actions .primary-link { margin-top: 0; }
.secondary-link { color: #cfe0ea; font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
.secondary-link:hover { color: var(--mint); }
.primer { margin: 8px 0 34px; padding: 26px; border: 1px solid #3c5a52; border-radius: 18px; background: linear-gradient(160deg, #11222a, #101923 55%); scroll-margin-top: 20px; }
.primer:focus-visible { outline-offset: 2px; }
.primer-head .eyebrow { color: var(--mint); }
.primer-head h2 { margin-top: 8px; font-size: clamp(21px, 2.2vw, 28px); line-height: 1.45; font-weight: 650; }
.primer-head > p:last-child { margin-top: 8px; color: #c4d2dc; font-size: 14px; line-height: 1.8; }
.primer-chapters { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 20px 0 22px; }
.primer-chapters button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 12px; border: 1px solid #44596a; border-radius: 99px; background: #15222d; color: #dbe5ec; font-size: 13px; }
.primer-chapters button span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #253747; font: 600 12px/1 Consolas, monospace; }
.primer-chapters button[aria-current='step'] { border-color: var(--mint); background: #1d3a34; color: #fff; }
.primer-chapters button[aria-current='step'] span { background: var(--mint); color: #10251f; }
.primer-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: start; }
.primer-map { margin: 0; position: sticky; top: 16px; }
.primer-grid { display: grid; grid-template-columns: 22px repeat(var(--primer-columns), minmax(0, 1fr)); gap: 5px; width: min(100%, 470px); margin: 0 auto; }
.primer-axis { display: grid; place-items: center; color: #b5c3cf; font: 12px/1 Consolas, monospace; min-height: 20px; }
.primer-cell { position: relative; display: grid; place-items: center; aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 7px; border: 1px solid #44566a; background: #182633; color: #edf2f5; font: 600 15px/1 Consolas, monospace; }
.primer-cell--wall { background: repeating-linear-gradient(135deg, #3a4a5a 0, #3a4a5a 5px, #26323d 5px, #26323d 10px); border-color: #8696a5; }
.primer-cell.is-wave { background: #1f3a5a; border-color: #6d9cd6; color: #eef5ff; }
.primer-cell.is-open { background: #3d2c15; border-color: #ffb783; color: #fff3e6; }
.primer-cell.is-new { background: #3d2c15; border: 2px dashed #ffd56b; color: #fff3e6; }
.primer-cell.is-closed { background: #183a33; border-color: #5d9d8d; color: #dcf4ed; }
.primer-cell.is-focus { background: #3c3613; border: 2px solid #ffd56b; color: #fff8dc; }
.primer-cell.is-wrong { background: #4a1f25; border: 2px solid #ff9a9a; color: #fff0f0; }
.primer-cell.is-current, .primer-cell.is-path { background: var(--mint); border-color: #d5fff3; color: #0f241e; }
.primer-cell.is-current { box-shadow: 0 0 0 3px rgba(133,227,205,.35); }
.primer-cell--start, .primer-cell--goal { color: #14231f; }
.primer-cell--start { background: var(--mint); border-color: var(--mint); }
.primer-cell--goal { background: var(--peach); border-color: var(--peach); color: #2e1b0c; }
.primer-cell--goal.is-open { box-shadow: inset 0 0 0 3px #3d2c15; }
.primer-cell.is-pickable { cursor: pointer; box-shadow: 0 0 0 2px rgba(255,183,131,.35); }
.primer-cell.is-pickable:hover { filter: brightness(1.15); }
.primer-tag { position: absolute; left: 4px; bottom: 3px; font-size: 11px; }
.primer-main { font-size: 17px; }
.primer-g, .primer-h { position: absolute; top: 3px; font: 10px/1 Consolas, monospace; }
.primer-g { left: 4px; }
.primer-h { right: 4px; }
.primer-map figcaption { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin-top: 12px; color: #c2d0db; font-size: 12px; }
.primer-map figcaption span { display: inline-flex; align-items: center; gap: 6px; }
.primer-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid #8a9aa8; }
.primer-swatch--start { background: var(--mint); }
.primer-swatch--goal { background: var(--peach); }
.primer-swatch--wall { background: repeating-linear-gradient(135deg, #aab5bf 0, #aab5bf 2px, #31404f 2px, #31404f 4px); }
.primer-swatch--open { background: #3d2c15; border-color: #ffb783; }
.primer-swatch--new { background: #3d2c15; border: 2px dashed #ffd56b; }
.primer-swatch--closed { background: #183a33; border-color: #5d9d8d; }
.primer-text { min-width: 0; font-size: 15px; line-height: 1.9; color: #dfe8ee; }
.primer-text h3 { font-size: 18px; font-weight: 650; margin-bottom: 10px; color: #fff; }
.primer-text h4 { margin: 18px 0 6px; font-size: 15px; }
.primer-text p { margin: 0 0 10px; }
.primer-text b { color: #fff; }
.primer-list, .primer-steps { margin: 0 0 12px; padding-left: 22px; }
.primer-list li, .primer-steps li { margin-bottom: 6px; }
.primer-steps small { color: #c6d4de; font-size: 13px; }
.primer-aside { color: #bdcbd6; font-size: 13px; }
.primer-terms { display: grid; gap: 8px; margin: 0 0 14px; }
.primer-terms > div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid #33485a; border-radius: 9px; background: #14212b; }
.primer-terms dt { font: 700 20px/1.4 Consolas, monospace; color: var(--mint); }
.primer-terms dd { margin: 0; font-size: 14px; }
.primer-question { margin: 12px 0; padding: 12px 14px; border: 1px solid #3b5162; border-radius: 10px; background: #13202a; min-width: 0; }
.primer-question legend, .primer-legend { padding: 0 4px; font-weight: 600; color: #fff; font-size: 14px; line-height: 1.7; }
.primer-question label { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; padding: 6px 8px; border-radius: 7px; font-size: 14px; line-height: 1.6; cursor: pointer; }
.primer-question label input { margin-top: 5px; accent-color: var(--mint); }
.primer-question label.is-answer { background: #1d3d35; color: #eafff8; }
.primer-question label.is-wrong { background: #46212a; color: #ffeef0; }
.primer-chips, .primer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.primer-explain { margin-top: 10px !important; padding: 10px 12px; border-left: 3px solid var(--mint); background: #142a26; border-radius: 0 8px 8px 0; font-size: 14px; }
.primer-number { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 10px; margin: 10px 0; }
.primer-number label { display: grid; gap: 6px; font-size: 14px; flex: 1 1 260px; }
.primer-number input { width: 90px; min-height: 40px; padding: 6px 10px; border: 1px solid #6b8394; border-radius: 7px; background: #0d1620; color: #fff; font: 600 16px Consolas, monospace; }
.primer-number p { flex-basis: 100%; margin: 0 !important; font-size: 14px; }
.is-right { color: #a6f3dc; }
.is-wrong { color: #ffc0c0; }
.primer-progress { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; color: #cbd8e1; font-size: 13px; }
.primer-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 14px; }
.primer-table caption { text-align: left; color: #c2d0db; font-size: 12px; padding-bottom: 6px; }
.primer-table th, .primer-table td { padding: 5px 8px; border-bottom: 1px solid #2c3d4c; text-align: center; font-family: Consolas, 'Microsoft YaHei', monospace; }
.primer-table thead th { color: #c2d0db; font-size: 12px; font-weight: 500; }
.primer-table tr.is-chosen { background: #1f4a40; }
.primer-table tr.is-mine th { box-shadow: inset 3px 0 0 #ffd56b; }
.primer-row-pick { min-height: 32px; padding: 2px 10px; border: 1px solid #ffb783; border-radius: 6px; background: #3d2c15; color: #fff3e6; font: 600 14px Consolas, monospace; }
.primer-reveal { margin-top: 6px; }
.primer-compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.primer-compare > div { padding: 12px; border: 1px solid #35505f; border-radius: 10px; background: #14212b; text-align: center; }
.primer-compare span { display: block; color: #c2d0db; font-size: 12px; }
.primer-compare strong { font: 700 28px/1.3 Consolas, monospace; color: #fff; }
.primer-summary { padding: 12px 14px; border: 1px solid var(--mint); border-radius: 10px; background: #173430; }
.primer-result { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #1a2f3c; }
.primer-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #2f4352; color: #c2d0db; font-size: 13px; }
.term-help { margin: -4px 0 12px; font-size: 12px; color: #d4e1df; }
.term-help summary { cursor: pointer; color: #b9f3e2; min-height: 28px; }
.term-help p { margin-top: 6px; line-height: 1.8; }
@media (max-width: 900px) {
  .primer { padding: 18px; }
  .primer-body { grid-template-columns: minmax(0, 1fr); }
  .primer-map { position: static; }
}
@media (max-width: 480px) {
  .primer { padding: 14px 12px; margin-inline: -8px; }
  .primer-chapters button { font-size: 12px; padding: 6px 10px; }
  .primer-grid { grid-template-columns: 16px repeat(var(--primer-columns), minmax(0, 1fr)); gap: 3px; }
  .primer-g, .primer-h { font-size: 8px; top: 2px; }
  .primer-main { font-size: 14px; }
  .primer-tag { font-size: 9px; }
  .primer-compare strong { font-size: 22px; }
}
